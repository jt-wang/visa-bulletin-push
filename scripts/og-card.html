<!-- Share card (public/og.png), 1200x630. Render: chrome --headless=new --window-size=1200,630 --screenshot=og.png og-card.html. Put your domain in .url for a private copy. -->
<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@600&family=IBM+Plex+Sans:wght@600;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1200px;height:630px;background:#fff;font-family:"IBM Plex Sans",sans-serif;color:#000}
.wrap{box-sizing:border-box;width:1200px;height:630px;padding:72px 80px;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(180deg,#f2f3fc 0%,#ffffff 70%);border-bottom:10px solid #4f58c9}
.brand{display:flex;align-items:center;gap:14px;font-size:30px;font-weight:600}
.logo{width:40px;height:40px}
h1{font-size:76px;line-height:1.02;letter-spacing:-2.5px;margin:0;font-weight:700;max-width:900px}
.row{display:flex;align-items:flex-end;justify-content:space-between}
.date{font-family:"IBM Plex Sans",sans-serif;font-size:46px;font-weight:700}
.date mark{background:#4f58c9;color:#fff;padding:4px 18px;border-radius:10px}
.cap{font-size:24px;color:#555;margin-bottom:12px}
.url{font-family:"IBM Plex Mono",monospace;font-size:28px;font-weight:600}
</style></head><body><div class="wrap">
<div class="brand"><svg class="logo" viewBox="0 0 24 24"><rect x="1" y="10" width="22" height="7" rx="1.5" fill="#4F58C9"/><rect x="2" y="5" width="13" height="2.4" rx="1.2" fill="#000"/><rect x="2" y="12.3" width="17" height="2.4" rx="1.2" fill="#000"/></svg>Visa Bulletin Push</div>
<h1>Green card dates, the minute they move.</h1>
<div class="row"><div><div class="cap">China &amp; India EB-1, EB-2, EB-3, for you and your AI agent</div><div class="date"><mark>Can I file this month?</mark></div></div><div class="url"></div></div>
</div></body></html>
